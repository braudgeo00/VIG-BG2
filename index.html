<title>Calculateur de vidange — fûts</title>
<style>
:root { color-scheme: light; --ink:#1f2937; --muted:#64748b; --line:#dbe2ea; --accent:#176b5b; --bg:#f3f6f8; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
main { max-width:760px; margin:40px auto; padding:0 18px; }
.panel { background:white; border:1px solid var(--line); border-radius:18px; padding:26px; box-shadow:0 8px 30px #1725540c; }
h1 { margin:0 0 8px; font-size:clamp(1.5rem,4vw,2rem); }
.intro { color:var(--muted); margin:0 0 24px; }
.fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
.field { display:flex; flex-direction:column; gap:7px; }
.field.capacity { grid-column:1/-1; }
label { font-weight:650; font-size:.95rem; }
input,select { width:100%; padding:12px 13px; border:1px solid #cbd5e1; border-radius:10px; background:#fff; color:var(--ink); font:inherit; }
input:focus,select:focus { outline:3px solid #176b5b22; border-color:var(--accent); }
.result { margin-top:22px; border-radius:14px; padding:20px; background:#edf6f3; border:1px solid #c7e4da; }
.result small { display:block; color:#42675e; font-weight:650; text-transform:uppercase; letter-spacing:.06em; }
.value { font-size:clamp(2rem,7vw,3rem); font-weight:750; color:var(--accent); margin-top:3px; font-variant-numeric:tabular-nums; }
.unit { color:#42675e; }
.status { min-height:1.5em; color:#9a3412; margin-top:12px; font-size:.9rem; }
.details { margin-top:20px; color:var(--muted); font-size:.88rem; line-height:1.5; }
footer { text-align:center; color:var(--muted); font-size:.8rem; padding:18px 0 30px; }
@media(max-width:520px) { .fields { grid-template-columns:1fr; } .field.capacity { grid-column:auto; } .panel { padding:20px; } main { margin:20px auto; } }
.byline { margin: -2px 0 24px; color: var(--muted); font-size: .95rem; }
</style>
<style>

/* --- Interface inspirée du Pip-Boy 3000 --- */
:root {
  color-scheme: dark;
  --ink: #9cff75;
  --muted: #65b94f;
  --line: #397d2d;
  --accent: #b4ff91;
  --bg: #071008;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: #030804; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background:
    radial-gradient(ellipse at center, rgba(28,75,22,.24), transparent 72%),
    #030804;
  font-family: "Courier New", Courier, monospace;
  letter-spacing: .035em;
  text-shadow: 0 0 5px rgba(143,255,102,.45);
  position: relative;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background: repeating-linear-gradient(
    to bottom,
    rgba(160,255,120,.035) 0px,
    rgba(160,255,120,.035) 1px,
    transparent 2px,
    transparent 4px
  );
  opacity: .45;
}
main {
  max-width: 760px;
  margin: 30px auto;
  padding: 0 18px;
}
.panel {
  position: relative;
  overflow: hidden;
  background: rgba(5,18,7,.96);
  border: 2px solid #6cb64e;
  border-radius: 18px;
  padding: 26px;
  box-shadow:
    0 0 10px rgba(121,255,83,.35),
    0 0 35px rgba(76,190,49,.13),
    inset 0 0 28px rgba(91,196,56,.09);
}
.panel::before {
  content: "ROBCO INDUSTRIES  //  PERSONAL INFORMATION PROCESSOR";
  display: block;
  color: #71c956;
  font-size: .68rem;
  letter-spacing: .12em;
  border-bottom: 1px solid #397d2d;
  padding-bottom: 12px;
  margin-bottom: 20px;
}
h1 {
  margin: 0 0 6px;
  color: #b7ff91;
  font-size: clamp(1.6rem, 5vw, 2.15rem);
  text-transform: uppercase;
  letter-spacing: .09em;
  text-shadow: 0 0 8px rgba(151,255,104,.7);
}
.byline {
  margin: 0 0 24px;
  color: #70c956;
  font-size: .9rem;
  letter-spacing: .18em;
  text-transform: uppercase;
}
.fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.field.capacity { grid-column: 1 / -1; }
label {
  color: #9cff75;
  font-weight: 700;
  font-size: .9rem;
  text-transform: uppercase;
  letter-spacing: .1em;
}
input, select {
  width: 100%;
  min-height: 48px;
  padding: 12px 13px;
  border: 1px solid #65a94b;
  border-radius: 5px;
  background: #09190b;
  color: #b7ff91;
  font: inherit;
  font-size: 1rem;
  box-shadow: inset 0 0 12px rgba(98,201,65,.08);
}
input:focus, select:focus {
  outline: 2px solid #b4ff91;
  outline-offset: 2px;
  box-shadow: 0 0 12px rgba(151,255,104,.3);
}
.result {
  margin-top: 24px;
  padding: 20px;
  border: 1px solid #70bd50;
  border-radius: 5px;
  background: rgba(22,57,17,.42);
  box-shadow: inset 0 0 22px rgba(116,255,77,.08), 0 0 12px rgba(116,255,77,.12);
}
.result small {
  display: block;
  color: #80d65e;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .16em;
}
.value {
  margin-top: 6px;
  color: #c4ff9f;
  font-size: clamp(2.4rem, 9vw, 3.5rem);
  font-weight: 700;
  letter-spacing: .04em;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 8px rgba(168,255,126,.85), 0 0 22px rgba(113,255,72,.35);
}
.status {
  min-height: 1.5em;
  margin-top: 12px;
  color: #ffc66b;
  font-size: .85rem;
}
@media (max-width: 520px) {
  main { margin: 14px auto; padding: 0 10px; }
  .panel { padding: 19px; border-radius: 12px; }
  .fields { grid-template-columns: 1fr; }
  .field.capacity { grid-column: auto; }
  .panel::before { font-size: .57rem; }
}


/* --- Pied de page VIG-BG --- */
.vigbg {
  text-align: center;
  padding: 10px 10px 44px;
  color: #b7ff91;
  user-select: none;
}
.vigbg .vt-name {
  font-family: "Arial Black", Impact, "Courier New", sans-serif;
  font-size: clamp(2.2rem, 11vw, 4.2rem);
  font-weight: 900;
  letter-spacing: .12em;
  line-height: 1;
  color: #c4ff9f;
  text-shadow: 0 0 10px rgba(168,255,126,.9), 0 0 30px rgba(113,255,72,.4);
}
.vigbg .vt-tag {
  margin-top: 10px;
  font-size: .72rem;
  letter-spacing: .35em;
  text-transform: uppercase;
  color: #70c956;
}

/* --- Animation de démarrage --- */
#boot {
  position: fixed; inset: 0; z-index: 100;
  background: #030804;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; cursor: pointer;
  transition: opacity .6s ease, filter .6s ease;
}
#boot.off { opacity: 0; filter: brightness(2.2) blur(2px); pointer-events: none; }
#boot .boot-inner { width: min(520px, 100%); }
#boot .boot-brand {
  text-align: center; font-family: "Arial Black", Impact, sans-serif;
  font-size: clamp(1.8rem, 8vw, 2.8rem); letter-spacing: .14em; color: #c4ff9f;
  text-shadow: 0 0 10px rgba(168,255,126,.9); margin-bottom: 22px;
}
#bootlog { min-height: 7.5em; font-size: .78rem; line-height: 1.5; color: #8de46b; white-space: pre-wrap; }
.bar { height: 22px; margin-top: 14px; border: 2px solid #6cb64e; padding: 2px; box-shadow: 0 0 10px rgba(121,255,83,.35); }
.bar > i {
  display: block; height: 100%; width: 0%;
  background: repeating-linear-gradient(90deg, #9cff75 0 8px, transparent 8px 11px);
  box-shadow: 0 0 10px rgba(151,255,104,.7);
}
.pct { text-align: right; font-size: .8rem; margin-top: 6px; color: #70c956; }
.skip { text-align: center; margin-top: 22px; font-size: .65rem; letter-spacing: .25em; color: #397d2d; text-transform: uppercase; }
body.booting { overflow: hidden; }

</style>
</head>

const capacityEl = document.getElementById('capacity');
const wetEl = document.getElementById('wet');
const bungEl = document.getElementById('bung');
const resultEl = document.getElementById('result');
const statusEl = document.getElementById('status');

function addOptions(select, values, preferred) {
  select.innerHTML = '';
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    if (String(v) === String(preferred)) opt.selected = true;
    select.appendChild(opt);
  });
}

function capacitiesForCalculation(capacity) {
  const available = Object.keys(DATA).map(Number).sort((a,b)=>a-b);
  if (DATA[String(capacity)]) return [String(capacity)];
  // Les tableaux Excel sont fournis tous les 20 litres :
  // les contenances intermédiaires utilisent la moyenne des deux voisins.
  const lower = [...available].reverse().find(n => n < capacity);
  const upper = available.find(n => n > capacity);
  return lower !== undefined && upper !== undefined ? [String(lower), String(upper)] : [];
}

function updateSelectors() {
  const cap = Number(capacityEl.value);
  const keys = capacitiesForCalculation(cap);
  if (!keys.length) {
    addOptions(wetEl, [], null); addOptions(bungEl, [], null);
    calculate(); return;
  }
  // Les tableaux sources partagent les mêmes niveaux pour chaque capacité.
  const source = DATA[keys[0]];
  const wetValues = Object.keys(source.rows).map(Number).sort((a,b)=>a-b);
  const bungValues = source.headers.map(Number).sort((a,b)=>a-b);
  const oldWet = wetEl.value || '31';
  const oldBung = bungEl.value || '80';
  addOptions(wetEl, wetValues, wetValues.includes(Number(oldWet)) ? oldWet : (wetValues.includes(31) ? 31 : wetValues[0]));
  addOptions(bungEl, bungValues, bungValues.includes(Number(oldBung)) ? oldBung : (bungValues.includes(80) ? 80 : bungValues[0]));
  calculate();
}

function lookup(capacity, wet, bung) {
  const ds = DATA[String(capacity)];
  if (!ds || !ds.rows[String(wet)] || ds.rows[String(wet)][String(bung)] === undefined) return null;
  return Number(ds.rows[String(wet)][String(bung)]) / 100;
}

function calculate() {
  const cap = Number(capacityEl.value), wet = Number(wetEl.value), bung = Number(bungEl.value);
  const keys = capacitiesForCalculation(cap);
  if (!keys.length || !Number.isFinite(wet) || !Number.isFinite(bung)) {
    resultEl.textContent = '—'; statusEl.textContent = 'Données indisponibles pour cette sélection.'; return;
  }
  const vals = keys.map(k => lookup(k, wet, bung));
  if (vals.some(v => v === null)) {
    resultEl.textContent = '—'; statusEl.textContent = 'Cette combinaison Mouillé / Sous-bonde est absente du tableau.'; return;
  }
  // Pour les contenances intermédiaires (410, 430, 450, 470),
  // le classeur Excel fait la moyenne des deux contenances voisines.
  const result = vals.reduce((a,b)=>a+b,0) / vals.length;
  resultEl.textContent = result.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2});
  statusEl.textContent = '';
}

capacityEl.addEventListener('change', updateSelectors);
wetEl.addEventListener('change', calculate);
bungEl.addEventListener('change', calculate);
updateSelectors();

// --- Séquence de démarrage Pip-Boy ---
(function () {
  const bootEl = document.getElementById('boot');
  const log = document.getElementById('bootlog');
  const bar = document.getElementById('bootbar');
  const pct = document.getElementById('bootpct');
  const lines = [
    'ROBCO INDUSTRIES (TM) TERMLINK',
    'PIP-BOY 3000 MARK IV',
    'INITIALISATION DU SYSTÈME...',
    'CHARGEMENT DES TABLES DE VIDANGE... OK',
    'VÉRIFICATION DES FÛTS 260-500... OK',
    'PRÊT.'
  ];
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DURATION = reduced ? 800 : 4200;
  let done = false, timers = [];
  document.body.classList.add('booting');

  function finish() {
    if (done) return; done = true;
    timers.forEach(clearTimeout); cancelAnimationFrame(raf);
    bootEl.classList.add('off');
    document.body.classList.remove('booting');
    setTimeout(() => bootEl.remove(), 700);
  }
  bootEl.addEventListener('click', finish);
  window.addEventListener('keydown', finish, { once: true });

  lines.forEach((t, i) => timers.push(setTimeout(() => { log.textContent += (i ? '\n' : '') + '> ' + t; },
    (DURATION / (lines.length + 1)) * (i + 0.5))));

  const start = performance.now();
  let raf;
  function tick(now) {
    // progression par à-coups, comme un vieux terminal
    const p = Math.min(1, (now - start) / DURATION);
    const stepped = Math.min(100, Math.floor((p * 100) / 4) * 4 + (p >= 1 ? 4 : 0));
    bar.style.width = stepped + '%';
    pct.textContent = stepped + '%';
    if (p < 1) raf = requestAnimationFrame(tick);
    else timers.push(setTimeout(finish, 450));
  }
  raf = requestAnimationFrame(tick);
})();
